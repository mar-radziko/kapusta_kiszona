<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>nowy_pokój_natalki_kapusta_kiszona</title>

    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: rgb(31, 31, 31);
            overflow: hidden;
        }

        .napis_xd {
            display: block;
            margin: 30px;
            color: white;
            font-size: 2rem;
            font-family: Arial, sans-serif;
            font-weight: bolder;
        }

        button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            height: 4rem;
            width: 10rem;

            font-size: 1.5rem;
            border-radius: 5px;
            border: none;

            box-shadow: 1px 1px 5px black;
            background-color: rgb(238, 33, 142);

            font-weight: bolder;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <a class="napis_xd">Natalka chyba ma nowy pokój???</a>

    <button id="runaway-btn">No chyba nie.</button>

    <script>
        const button = document.getElementById("runaway-btn");

        const getRandomNumber = (num) => {
            return Math.floor(Math.random() * (num + 1));
        };

        const animateMove = (element, prop, pixels) => {
            return anime({
                targets: element,
                [prop]: `${pixels}px`,
                easing: "easeOutCirc",
                duration: 500
            });
        };

        ["mouseover", "click"].forEach((eventName) => {

            button.addEventListener(eventName, function () {

                const maxTop = window.innerHeight - this.offsetHeight;
                const maxLeft = window.innerWidth - this.offsetWidth;

                const top = getRandomNumber(maxTop);
                const left = getRandomNumber(maxLeft);

                animateMove(this, "left", left);
                animateMove(this, "top", top);
            });

        });
    </script>

</body>
</html>
